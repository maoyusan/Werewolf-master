[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "werewolf-qqbot"
version = "0.1.0"
description = "Python Linux Werewolf game for the official QQ bot platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "qq-botpy==1.2.1",
  "aiohttp>=3.9,<4",
  "APScheduler>=3.10,<4",
  "asyncpg==0.30.0",
  "alembic==1.16.4",
]

[project.scripts]
werewolf-qqbot = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["domain*", "application*", "adapters*", "infrastructure*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
